<canvas id="stars-bg"></canvas>
<script>
(() => {
  const canvas = document.getElementById("stars-bg");
  const ctx = canvas.getContext("2d");
  const mouse = { x: -1e4, y: -1e4 };
  const animate = !matchMedia("(prefers-reduced-motion: reduce)").matches;
  let stars = [];

  function resize() {
    canvas.width = innerWidth;
    canvas.height = innerHeight;
    stars = Array.from({ length: 70 }, () => ({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      vx: (Math.random() - 0.5) * 0.2,
      vy: (Math.random() - 0.5) * 0.2,
      r: Math.random() * 1.4 + 0.4
    }));
  }

  function step() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = "rgba(255,255,255,0.8)";
    for (const s of stars) {
      const dx = mouse.x - s.x, dy = mouse.y - s.y;
      const d2 = dx * dx + dy * dy;
      if (d2 < 40000) { s.vx += dx / d2 * 0.5; s.vy += dy / d2 * 0.5; }
      s.vx *= 0.99; s.vy *= 0.99;
      s.x = (s.x + s.vx + canvas.width) % canvas.width;
      s.y = (s.y + s.vy + canvas.height) % canvas.height;
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fill();
    }
    if (animate) requestAnimationFrame(step);
  }

  addEventListener("resize", () => { resize(); if (!animate) step(); });
  addEventListener("mousemove", e => { mouse.x = e.clientX; mouse.y = e.clientY; });
  resize();
  step();
})();
</script>
